<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aikya Sira Kumar | Data Scientist, Aviation &amp; Life Sciences</title>
<meta name="description" content="Data Scientist building ML, GenAI and graph-learning systems for aviation and life sciences. Open to full-time roles in Mannheim.">
<meta property="og:title" content="Aikya Sira Kumar | Data Scientist">
<meta property="og:description" content="ML, GenAI and graph learning for aviation and life sciences.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--muted:#55607a;--bg:#f3f5f9;--card:#fff;--line:#d9dfeb;--sky:#2f6fed;--space:#070b1a;--glow:#9cc2ff;--r:14px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:17px/1.65 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.15}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
nav{position:fixed;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(7,11,26,.72);backdrop-filter:blur(8px);color:#fff}
nav b{font-family:"Space Grotesk";font-size:18px}
nav div a{color:#cfd9f5;text-decoration:none;margin-left:20px;font-size:15px}
nav div a:hover{color:#fff}
.hero{position:relative;min-height:100svh;background:var(--space);color:#fff;display:flex;align-items:center;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;padding-top:80px;padding-bottom:60px}
.hero p.hi{color:var(--glow);margin-bottom:14px}
.hero h1{font-size:clamp(38px,7vw,76px);max-width:15ch;letter-spacing:-.02em}
.hero p.sub{max-width:56ch;margin:22px 0 30px;color:#cfd9f5;font-size:19px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:500;margin:0 10px 10px 0;border:1.5px solid #fff;color:#fff}
.btn.main{background:#fff;color:var(--space)}
.btn:hover{transform:translateY(-2px)}
.tag{display:inline-block;margin-top:26px;padding:6px 14px;border:1px solid #3b4a7a;border-radius:999px;color:#cfd9f5;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:8px}
section{padding:92px 0}
section h2{font-size:clamp(28px,4vw,42px);margin-bottom:12px}
.lead{color:var(--muted);max-width:60ch;margin-bottom:36px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.card h3{font-size:21px;margin-bottom:8px}
.card p{color:var(--muted);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{font-size:13px;padding:3px 11px;border-radius:999px;background:#e8eefc;color:#26407f}
.proof{font-weight:500;color:var(--ink)!important;margin-top:12px}
.about{display:grid;gap:40px;grid-template-columns:1.4fr 1fr;align-items:start}
.about aside{background:var(--space);color:#cfd9f5;border-radius:var(--r);padding:26px}
.about aside h3{color:#fff;margin-bottom:10px}
.about aside li{margin:8px 0 8px 18px}
.feature{display:grid;gap:26px;grid-template-columns:1fr 1fr;background:var(--space);color:#e6ecff;border-radius:var(--r);padding:34px;margin-bottom:20px}
.feature h3{color:#fff;font-size:26px;margin-bottom:10px}
.feature .chips span{background:#1b2a5c;color:#bcd0ff}
.feature ul{margin-left:18px}.feature li{margin:8px 0}
.tl{border-left:2px solid var(--line);margin-left:6px}
.job{position:relative;padding:0 0 38px 28px}
.job::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--sky)}
.job time{color:var(--muted);font-size:14px}
.job h3{font-size:20px;margin:2px 0}
.job ul{margin:10px 0 0 18px;color:var(--muted);font-size:16px}
.cta{background:var(--space);color:#fff;text-align:center}
.cta h2{margin-bottom:14px}.cta p{color:#cfd9f5;max-width:50ch;margin:0 auto 28px}
footer{background:var(--space);color:#8d9bc4;text-align:center;padding:0 0 36px;font-size:14px}
.ph{overflow:hidden;border-radius:var(--r);aspect-ratio:1;background:#dfe6f5;margin-bottom:22px}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--z,1));transform-origin:var(--ox,50%) var(--oy,50%)}
.ph.about{--z:1.5;--ox:50%;--oy:53%}
.ph.about img{object-position:50% 45%}
.ph.contact{width:150px;border-radius:50%;margin:0 auto 24px;border:3px solid #3b4a7a;--z:1.9;--ox:63%;--oy:60%}
.ph.contact img{object-position:50% 55%}
.ph.autumn{aspect-ratio:4/5;margin:0}.ph.autumn img{object-position:50% 35%}
@media(max-width:760px){.about,.feature{grid-template-columns:1fr}nav div a:not(:last-child){display:none}section{padding:64px 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:hover{transform:none}}
</style>
</head>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">

<p
